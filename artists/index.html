<!doctype html><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>MATSU — Artist Contacts</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#12100e;color:#e8e3da;
  font:13px/1.45 ui-sans-serif,-apple-system,'Helvetica Neue',sans-serif}
header{position:sticky;top:0;z-index:20;background:#12100e;border-bottom:1px solid #2c2823;padding:12px 16px 10px}
h1{margin:0 0 2px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.sub{color:#8b8378;font-size:11.5px}
.vb{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;
  margin-right:4px;white-space:nowrap;border:1px solid transparent}
.vb.dual{background:#16301c;color:#8ee0a1;border-color:#2c5f38}
.vb.single{background:#2a2620;color:#9a917f;border-color:#3a352d}
.dualstat{color:#8ee0a1}
#bDual.on{background:#16301c;border-color:#2c5f38;color:#8ee0a1}
.cxtag{font-size:10.5px;padding:1px 6px;border-radius:9px;white-space:nowrap}
.cxok{background:#16301c;color:#7fd18f;border:1px solid #24512d}
.cxbad{background:#3a1a17;color:#e58e7f;border:1px solid #66302a}
.cxmid{background:#2a2620;color:#a49a8b;border:1px solid #3a352d}
.hv{color:#7fd18f;font-weight:700;margin-left:5px;font-size:11px}
.ctl{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
input,select{background:#1c1916;color:#e8e3da;border:1px solid #35302a;border-radius:5px;
  padding:7px 9px;font:inherit;min-width:0}
input{flex:1 1 240px}
button{background:#1c1916;color:#b8b0a4;border:1px solid #35302a;border-radius:5px;
  padding:7px 10px;font:inherit;cursor:pointer;white-space:nowrap}
button.on{background:#c0642c;border-color:#c0642c;color:#fff}
table{border-collapse:collapse;width:100%}
thead th{position:sticky;top:0;z-index:10;background:#191613;color:#8b8378;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.07em;text-align:left;font-weight:600;
  padding:7px 10px;border-bottom:1px solid #2c2823;cursor:pointer;white-space:nowrap}
thead th:hover{color:#e8e3da}
tbody tr{border-bottom:1px solid #201d1a;cursor:pointer}
tbody tr:nth-child(even){background:#161311}
tbody tr:hover{background:#241f1b}
td{padding:5px 10px;vertical-align:baseline}
.nm{font-weight:600;white-space:nowrap}
.nm i{display:block;font-weight:400;font-style:italic;color:#8b8378;font-size:11px;margin-top:1px}
.em{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#cfc8bc;
  max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash{color:#5a524a}
.tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:3px;
  border:1px solid #3a342d;color:#8b8378;white-space:nowrap}
.tag.high{color:#6cbf82;border-color:#2f5c3c}
.tag.medium{color:#d0ae3c;border-color:#5c4d1f}
.tag.low{color:#8b8378}
.wh{color:#a89f92;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.fs{color:#8b8378;text-align:right;width:34px}
.ig{width:112px;max-width:112px;overflow:hidden}
.ig a{color:#8b8378;font-size:10.5px;text-decoration:none;border:1px solid #35302a;border-radius:3px;padding:1px 5px;display:inline-block;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.ig a:hover{color:#e88f4d;border-color:#e88f4d}
a.iglink{color:#e88f4d;text-decoration:none;border-color:#5a3a20}
a.iglink:hover{text-decoration:underline;border-color:#e88f4d}
tr.hi .nm{border-left:3px solid #4a9d5f;padding-left:7px;margin-left:-10px}
tr.mid .nm{border-left:3px solid #c0a02c;padding-left:7px;margin-left:-10px}
tr.none .nm,tr.todo .nm{border-left:3px solid transparent;padding-left:7px;margin-left:-10px}
tr.none,tr.todo{color:#8b8378}
#empty{padding:36px 16px;color:#8b8378}
/* detail popup */
#ov{position:fixed;inset:0;background:rgba(8,7,6,.72);display:none;z-index:50;padding:24px}
#ov.on{display:flex;align-items:flex-start;justify-content:center}
#pop{background:#1a1714;border:1px solid #35302a;border-radius:8px;max-width:620px;width:100%;
  max-height:calc(100vh - 48px);overflow:auto;padding:18px 20px}
#pop h2{margin:0;font-size:17px}
#pop .rn{color:#9c9488;font-style:italic;font-size:12px;margin-top:2px}
#pop .meta{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
#pop .chip{font-size:10.5px;background:#241f1b;color:#a89f92;border-radius:3px;padding:2px 7px}
#pop h3{margin:16px 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#7d746a}
#pop .c{background:#221e1a;border-radius:5px;padding:7px 9px;margin-bottom:5px;border-left:2px solid #55504a}
#pop .c.high{border-left-color:#4a9d5f} #pop .c.medium{border-left-color:#c0a02c} #pop .c.low{border-left-color:#6b635a}
#pop .c a{color:#e8e3da;font-family:ui-monospace,Menlo,monospace;font-size:12px;text-decoration:none;word-break:break-all}
#pop .c a:hover{color:#e88f4d}
#pop .c .m{font-size:10.5px;color:#8b8378;margin-top:2px}
#pop .src{font-size:10px;color:#6f665d;word-break:break-all}
#pop .nt{font-size:11.5px;color:#9c9488;background:#221e1a;border-radius:5px;padding:8px 10px;margin-top:4px}
#x{float:right;background:none;border:none;color:#8b8378;font-size:20px;cursor:pointer;line-height:1;padding:0 2px}
</style>
<header>
<h1>Artist Contacts</h1>
<div class=sub><b>532</b> artists across every lineup &middot;
 <b>381</b> have an email (72%) &middot;
 <b>266</b> have an Instagram (50%) &middot;
 <b>139</b> have neither &middot;
 <b class=dualstat>214</b> dual-verified &middot;
 218 with a manager/media door &middot; 2026-09-05</div>
<div class=ctl>
 <input id=q placeholder="search artist, real name, manager, email, agency&hellip;" autocomplete=off>
 <select id=fest><option value="">all festivals</option><option value="Breakaway Utah 2026">Breakaway Utah</option><option value="Dreamstate SoCal 2026">Dreamstate SoCal</option><option value="Escape Halloween 2026">Escape Halloween</option><option value="Hulaween 2026">Hulaween</option><option value="Lights All Night 2026">Lights All Night</option><option value="Lost Lands 2026">Lost Lands</option><option value="Niteharts 2026">Niteharts</option><option value="San Marcos Block Party 2026">San Marcos Block Party</option><option value="Wasteland 2026">Wasteland</option></select>
 <button id=bAll class=on>all</button>
 <button id=bAny>has an email</button>
 <button id=bIg>has an Instagram</button>
 <button id=bNo>no contact yet</button>
 <button id=bDual title="only records Claude and Codex both confirmed independently">&#10003;&#10003; dual-verified</button>
 <button id=bHi>manager/media only</button>
</div>
</header>
<table>
<thead><tr>
<th data-c=0>Artist</th><th data-c=1>Best contact</th><th data-c=2>Type</th><th data-c=3>Who</th><th data-c=4>IG</th><th data-c=5>Verified</th><th data-c=6 style="text-align:right">Fests</th>
</tr></thead>
<tbody id=tb></tbody>
</table>
<div id=empty hidden>Nothing matches.</div>
<div id=ov onclick="if(event.target===this)closeRow()"><div id=pop></div></div>
<script type="module">
/* All 532 contacts used to be baked straight into this file, which meant anyone
   who found the URL had the whole list — view-source defeats any JS-only gate.
   The page now ships EMPTY and pulls its rows and detail out of Firestore after
   a named sign-in, so the Firestore rules are what actually protect it. */
import { requireAuth } from "../auth.js";
var q=document.getElementById('q'),fe=document.getElementById('fest'),
    bh=document.getElementById('bHi'),ba=document.getElementById('bAny'),
    bAll=document.getElementById('bAll'),bIg=document.getElementById('bIg'),
    bNo=document.getElementById('bNo'),bDual=document.getElementById('bDual'),
    tb=document.getElementById('tb'),emp=document.getElementById('empty'),
    ov=document.getElementById('ov'),pop=document.getElementById('pop');
const {app}=await requireAuth({"apiKey": "AIzaSyAAnT69AtL-m53iQ-DuCF0PRNrdHcmvZaM", "authDomain": "lake-toya-hq.firebaseapp.com", "projectId": "lake-toya-hq", "storageBucket": "lake-toya-hq.firebasestorage.app", "messagingSenderId": "246123481676", "appId": "1:246123481676:web:8017ebd6ac8b8f3530c2e9"},{label:"Your artist database"});
const {getFirestore,doc,getDoc}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
const _db=getFirestore(app);
var D={};
try{
  const _m=await getDoc(doc(_db,"art","meta"));
  const _n=_m.exists()?(_m.data().chunks||0):0;
  let _rows="";
  for(let i=0;i<_n;i++){
    const _c=await getDoc(doc(_db,"art","c"+i));
    if(!_c.exists()) continue;
    const _p=JSON.parse(_c.data().v);
    _rows+=_p.rows; Object.assign(D,_p.detail);
  }
  tb.innerHTML=_rows;
}catch(e){
  document.getElementById('empty').textContent=
    "Couldn't load the database: "+((e&&e.code)||e);
  document.getElementById('empty').hidden=false;
}
/* Default is EVERY artist. The page used to open filtered to "has an address",
   which made it look like acts were missing from the database when they were
   only hidden. */
var trs=[].slice.call(tb.rows), onlyHi=false, pile='all';
function apply(){
  var s=q.value.toLowerCase().trim(), f=fe.value, n=0;
  trs.forEach(function(r){
    var ok=(!s||r.dataset.s.indexOf(s)>-1)&&(!f||r.dataset.f.indexOf(f)>-1)
      &&(!onlyHi||r.classList.contains('hi'))
      &&(pile==='all'
         ||(pile==='mail'&&r.classList.contains('hasmail'))
         ||(pile==='ig'  &&r.classList.contains('hasig'))
         ||(pile==='no'  &&!r.classList.contains('hasmail')&&!r.classList.contains('hasig'))
         ||(pile==='dual'&&r.classList.contains('dualv')));
    r.hidden=!ok; if(ok)n++;
  });
  emp.hidden=n>0;
}
q.oninput=apply; fe.onchange=apply;
bh.onclick=function(){onlyHi=!onlyHi;bh.classList.toggle('on',onlyHi);apply()};
function setPile(p){
  pile=p;
  [[bAll,'all'],[ba,'mail'],[bIg,'ig'],[bNo,'no'],[bDual,'dual']].forEach(function(x){
    x[0].classList.toggle('on', pile===x[1]);
  });
  apply();
}
bAll.onclick=function(){setPile('all')};
ba.onclick=function(){setPile('mail')};
bIg.onclick=function(){setPile('ig')};
bNo.onclick=function(){setPile('no')};
bDual.onclick=function(){setPile('dual')};
/* click a column header to sort by it */
var sortCol=-1,sortAsc=true;
[].forEach.call(document.querySelectorAll('thead th'),function(th){
  th.onclick=function(){
    var c=+th.dataset.c;
    sortAsc = (c===sortCol) ? !sortAsc : true; sortCol=c;
    var arr=trs.slice();
    arr.sort(function(a,b){
      var x=a.cells[c].innerText.trim().toLowerCase(), y=b.cells[c].innerText.trim().toLowerCase();
      if(c===5){x=+x;y=+y}
      if(x===y)return 0; if(x===''&&y!=='')return 1; if(y===''&&x!=='')return -1;
      return (x<y?-1:1)*(sortAsc?1:-1);
    });
    arr.forEach(function(r){tb.appendChild(r)});
  };
});
function handleOf(u){return (u||'').replace(/\/+$/,'').split('/').pop()}
function openRow(i){
  var d=D[i]; if(!d)return;
  var h='<button id=x onclick="closeRow()">&times;</button><h2>'+esc(d.n)+'</h2>';
  if(d.rn) h+='<div class=rn>'+esc(d.rn)+'</div>';
  h+='<div class=meta>'+d.fs.map(function(f){return '<span class=chip>'+esc(f)+'</span>'}).join('')
    +(d.ag?'<span class=chip>agency: '+esc(d.ag)+'</span>':'')
    +(d.ig?'<a class="chip iglink" target=_blank rel=noopener href="'+esc(d.ig)+'">@'+esc(handleOf(d.ig))+'</a>':'')
    +'</div>';
  if(d.mg.length){
    h+='<h3>Management</h3>'+d.mg.map(function(m){
      return '<div class=nt>'+esc(m.n)+(m.o?' &middot; '+esc(m.o):'')+(m.r&&m.r!=='manager'?' ('+esc(m.r)+')':'')+'</div>';
    }).join('');
  }
  if(d.cs.length){
    h+='<h3>'+d.cs.length+' address'+(d.cs.length>1?'es':'')+'</h3>'+d.cs.map(function(c){
      return '<div class="c '+esc(c.c)+'"><a href="mailto:'+esc(c.e)+'">'+esc(c.e)+'</a>'
        +'<div class=m>'+esc(c.t)+' &middot; '+esc(c.c)+' confidence'
        +(c.p?' &middot; '+esc(c.p):'')+(c.o?' ('+esc(c.o)+')':'')+'</div>'
        +(c.s?'<div class=src>'+esc(c.s)+'</div>':'')+'</div>';
    }).join('');
  } else {
    h+='<h3>Addresses</h3><div class=nt>'+(d.st==='todo'?'Not researched yet.':'Nothing published that I could verify.')+'</div>';
  }
  if(d.nt) h+='<h3>Notes</h3><div class=nt>'+esc(d.nt)+'</div>';
  pop.innerHTML=h; ov.classList.add('on');
}
function closeRow(){ov.classList.remove('on')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeRow()});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
/* the rows carry onclick="openRow(n)" and the popup an onclick="closeRow()",
   and module scope is not the global scope — without this they silently die */
window.openRow=openRow; window.closeRow=closeRow;
apply();
</script>
